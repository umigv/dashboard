<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Control Interface</title>
    <link rel="stylesheet" href="/static/main.css">
    <link rel="icon" href="/static/favicon.png" type="image/png">
</head>

<body>
    <header class="header">
        <h1>Robot Control Interface</h1>
    </header>

    <div class="dashboard">
        <div class="panel">
            <div class="status-indicator">
                <div class="status-dot" id="robotStatus"></div>
                <span id="statusText">Ready to Run</span>
            </div>

            <h2>Controller Mode</h2>
            <div class="controller-modes">
                <button class="mode-button active" onclick="setMode(this)" id="disabled-button">Disabled</button>
                <button class="mode-button" onclick="setMode(this)" id="autonomous-button">Autonomous</button>
                <button class="mode-button" onclick="setMode(this)" id="teleop-button">Teleop</button>
                <!-- Hidden iframe to handle the form submission -->
                <iframe name="dummyframe" id="dummyframe" style="display: none;"></iframe>
                <form action="/startSelfDriving" method="post" target="dummyframe">
                    <button type="submit" name="Start Self Driving" value="Start Self Driving" class="mode-button">
                        Start Self Driving
                    </button>
                </form>
            </div>



            <button class="emergency-stop" onclick="emergencyStop()">EMERGENCY STOP</button>
        </div>

        <div class="panel">
            <h2 id="videoFeedText">Camera Feed</h2>

            <button id="switchButton" onclick="switchFeed()">Switch Feed</button>

            <img id="cameraFeed" src="/camera/" class="camera-feed">

            <canvas width="1920" height="1080" id="occupancyFeed" class="canvas-feed"></canvas>
            <!-- canvas default buffer dimensions are 300x150-->

            <canvas width="1920" height="1080" id="poseEstimatorFeed" class="canvas-feed"></canvas>

            <!-- <button id="poseEstimatorFeed" -->

            <script type="importmap">
            {
            "imports": {
                
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
                
                }
            }
            </script>
            <script type="module">
                import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
                import { STLLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/STLLoader.js';

                const cameraFeed = document.getElementById("cameraFeed");
                const occupancyFeed = document.getElementById("occupancyFeed");
                const poseEstimatorFeed = document.getElementById("poseEstimatorFeed");

                cameraFeed.style.display = "block";
                occupancyFeed.style.display = "none";
                poseEstimatorFeed.style.display = "none";

                const scene = new THREE.Scene();
                window.threeScene = scene;
                const dummy = new THREE.Object3D();
                window.dummy = dummy;


                const camera = new THREE.PerspectiveCamera(
                    75,
                    occupancyFeed.width / occupancyFeed.height,
                    0.1,
                    1000
                );

                camera.position.set(0, -60, 45);
                camera.lookAt(0, -31, 0);

                const renderer = new THREE.WebGLRenderer({
                    canvas: occupancyFeed,
                    antialias: true,
                });
                renderer.setSize(occupancyFeed.width, occupancyFeed.height, false);
                renderer.setPixelRatio(window.devicePixelRatio);

                scene.background = new THREE.Color(0xede7dd);
                scene.add(new THREE.AmbientLight(0x404040));
                const light = new THREE.DirectionalLight(0xffffff, 1);
                light.position.set(0, -1, 0.5);//having the light is necessary to properly show detail on the model
                scene.add(light);

                let mesh = null;

                function loadObject() {
                    const loader = new STLLoader();
                    loader.load("/static/Maverick_Assembly_STL.stl", (geometry) => {
                        geometry.center();
                        const material = new THREE.MeshPhongMaterial({ color: 0xaaaaaa }); //model must be phong otherwise the texture wont really show
                        mesh = new THREE.Mesh(geometry, material);
                        mesh.scale.setScalar(0.52); 
                        // ^this should make it roughly to scale, assuming each cell of the occGrid is about 5cm, this should make the robot relatively to scale with the cells, margin of error because I eyeballed how big the robot was before...
                        scene.add(mesh);
                        mesh.position.set(0, -60, 0);


                    });


                }

                loadObject();

                const hazardColors = [
                    0x247A4B, // darker subdued green
                    0x4C8F3A, // muted medium green
                    0x87A844, // softened olive-lime
                    0xB8B02F, // darker muted yellow
                    0xB6A727, // toned mustard yellow
                    0xB27433, // muted warm orange
                    0xA85C44, // deeper dusty peach
                    0xA5443C, // muted brick coral
                    0x9E3232, // toned deep red
                    0x861024  // darker restrained crimson
                ];

                const maxInstances = 10000;//this will get hard trimmed, just an initial value
                const geometry = new THREE.BoxGeometry(1, 1, 1);
                const material = [];
                window.instances = [];

                for (let i = 0; i < 10; i++) {
                    material[i] = new THREE.MeshBasicMaterial({ color: hazardColors[i] });
                    window.instances[i] = new THREE.InstancedMesh(geometry, material[i], maxInstances)
                    scene.add(window.instances[i]);
                }

                class EquilateralRoundedTriangleGeometry extends THREE.BufferGeometry {
                    constructor(height, rounding) {
                        let r = height / 3 * 2;
                        let ha = THREE.MathUtils.degToRad(30);
                        let h = rounding * (Math.sin(ha) + Math.cos(ha) * Math.sqrt(3));
                        let center = r - Math.min(r, h);

                        let base = new THREE.Vector2(0, center);
                        let c = new THREE.Vector2();
                        let v = new THREE.Vector2();

                        let angleStep = Math.PI / 6;

                        let shape = new THREE.Shape()
                        for (let i = 0; i < 3; i++) {
                            let a = angleStep * 4 * i;
                            v.copy(base).rotateAround(c, a);
                            shape.absarc(v.x, v.y, rounding, angleStep + a, angleStep * 5 + a);
                        }

                        let g = new THREE.ShapeGeometry(shape, 20);
                        super().copy(g);
                        this.center();
                        this.rotateX(-Math.PI / 2);

                        this.helper = new THREE.BufferGeometry().setFromPoints(Array.from({ length: 3 }, (_, idx) => {
                            return new THREE.Vector2(0, r).rotateAround(new THREE.Vector2(), Math.PI * 2 / 3 * idx);
                        }));
                    }
                }


                const poseEstimatorScene = new THREE.Scene();
                window.poseEstimatorScene = poseEstimatorScene;
                window.poseEstimatorScene.add(new THREE.AmbientLight(0xFFFFFF));

                const poseEstimatorCamera = new THREE.PerspectiveCamera(
                    75,
                    poseEstimatorFeed.width / poseEstimatorFeed.height,
                    0.1,
                    1000
                );

                window.poseEstimatorCamera = poseEstimatorCamera;

                poseEstimatorCamera.position.set(0, 10, 0);
                poseEstimatorCamera.lookAt(0, 0, 0);

                const poseEstimatorRenderer = new THREE.WebGLRenderer({
                    canvas: poseEstimatorFeed,
                    antialias: true,
                });
                poseEstimatorRenderer.setSize(poseEstimatorFeed.width, poseEstimatorFeed.height, false);
                poseEstimatorRenderer.setPixelRatio(window.devicePixelRatio);

                poseEstimatorScene.background = new THREE.Color(0xede7dd);


                let gTri = new EquilateralRoundedTriangleGeometry(.7, 0.05);
                let mTri = new THREE.MeshBasicMaterial({
                    color: 0x007ba7
                });
                let triangle = new THREE.Mesh(gTri, mTri);
                window.headerTriangle = triangle;


                window.poseEstimatorScene.add(window.headerTriangle);

                window.headerTriangle.frustumCulled = false;

                window.currentPosition = [0, 0, 0];
                window.currentLineIndex = 0;


                window.maxLineInstances = 200;
                const lineGeometry = new THREE.BoxGeometry(1, 0.1, 0.1);
                const lineMaterial = [];//make it an array to allow for expansion to multiple odom topics later
                window.lineInstances = [];

                for (let i = 0; i < 1; i++) {
                    lineMaterial[i] = new THREE.MeshBasicMaterial({ color: 0x007ba7 });
                    window.lineInstances[i] = new THREE.InstancedMesh(lineGeometry, lineMaterial[i], window.maxLineInstances);
                    window.poseEstimatorScene.add(window.lineInstances[i]);
                }


                window.pathInstance = new THREE.InstancedMesh(lineGeometry, new THREE.MeshBasicMaterial({ color: 0x007ba7}), 200);
                scene.add(window.pathInstance);
            

                function animate() {
                    requestAnimationFrame(animate);
                    
                    renderer.render(scene, camera);
                }


                animate();

                function poseEstimatorAnimate() {
                    requestAnimationFrame(poseEstimatorAnimate);

                    poseEstimatorRenderer.render(poseEstimatorScene, poseEstimatorCamera);
                }

                poseEstimatorAnimate();


            </script>

            <div class="hardware-info">
                <div class="speedometer" id="speedometer">
                    0 km/h
                </div>
                <div class="data-box">
                    <h3>IMU Data</h3>
                    <div id="imuRoll">Roll: 0.0°</div>
                    <div id="imuPitch">Pitch: 0.0°</div>
                    <div id="imuYaw">
Yaw: 0.0°</div>
                </div>

                <div class="data-box">
                    <h3>GPS Location</h3>
                    <div id="gpsLat">Lat: 0.0000° N</div>
                    <div id="gpsLong">Long: 0.0000° W</div>
                    <div id="gpsAlt">Alt: 0m</div>

                </div>


            </div>


        </div>

        <div class="panel">
            <div class="camera-controls">
                <div class="control-group">
                    <label>Brightness: <span id="brightnessValue">4</span></label>
                    <input type="range" min="0" max="8" value="4" id="brightnessSlider">
                </div>
                <div class="control-group">
                    <label>Contrast: <span id="contrastValue">4</span></label>
                    <input type="range" min="0" max="8" value="4" id="contrastSlider">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

        let occupancyMeshes = [];

        const feedStates = Object.freeze({
            CAMERA_FEED: 1,
            OCCUPANCY_FEED: 2,
            POSE_ESTIMATOR_FEED: 3
        });

        let showingFeed = feedStates.CAMERA_FEED;

        // Connect to the server
        const socket = io("http://localhost:3001");

        socket.on("connect", () => {
            console.log("✅ Connected to Socket.IO server!", socket.id);
        });

        // Initialize robot state
        let robotState = {
            isRunning: false,
            speed: 0,
            position: { x: 0, y: 0 },
            rotation: 0,
            mode: '',
            emergency: false
        };

        // Listen for robot status updates
        socket.on("robotStatus", (status) => {
            updateRobotStatus(status);
        });

        socket.on("gpsUpdate", (data) => {

            updateSensorDisplays(data);
        });

        socket.on("imuUpdate", (data) => {

            updateSensorDisplays(data);
        });

        socket.on("odomUpdate", (data) => {
            updateRobotPosition(data.odom.position);
            updateSensorDisplays(data);
        });

        socket.on("occupancyGridUpdate", (data) => {
            console.log("height in socket", data.occupancyGrid.height)
            if (showingFeed == 2) {
                updateOccupancyGridRender(data);
            }
        });

        socket.on("positionUpdate", (position) => {
            updateRobotPosition(position);
        });

        socket.on("pathUpdate", (data) => {
            updatePath(data);
        });



        // Camera control functions
        const brightnessSlider = document.getElementById('brightnessSlider');
        const contrastSlider = document.getElementById('contrastSlider');
        const brightnessValue = document.getElementById('brightnessValue');
        const contrastValue = document.getElementById('contrastValue');

        function updateCameraFiltersText() {
            brightnessValue.textContent = brightnessSlider.value;
            contrastValue.textContent = contrastSlider.value;
        }

        function postCameraFiltersUpdate() {
            const brightness = brightnessSlider.value;
            const contrast = contrastSlider.value;

            socket.emit("cameraSettings", {
                brightness: brightness,
                contrast: contrast
            });
        }

        [brightnessSlider, contrastSlider].forEach(slider => {
            slider.addEventListener('input', updateCameraFiltersText);
            slider.addEventListener('change', postCameraFiltersUpdate);
        });

        // Update robot status display
        function updateRobotStatus(status) {
            robotState.isRunning = status.isRunning;
            robotState.mode = status.mode;
            robotState.emergency = status.emergency;

            // Update status indicators
            const robotStatusDot = document.getElementById('robotStatus');
            const statusText = document.getElementById('statusText');

            if (status.emergency) {
                robotStatusDot.classList.add('error');
                robotStatusDot.classList.remove('warning');
                statusText.textContent = "Emergency Stop";
            } else if (!status.isRunning) {
                robotStatusDot.classList.add('warning');
                robotStatusDot.classList.remove('error');
                statusText.textContent = "Paused";
            } else {
                robotStatusDot.classList.remove('error', 'warning');
                statusText.textContent = "Running";
            }

            setMode(document.querySelector(`#${status.mode}-button`));
        }

        // Update robot position on visualization
        function updateRobotPosition(position) {

            robotState.position = position;
            addLineSegment(position);
            // window.poseEstimatorRenderer
        }

        // Update sensor displays
        function updateSensorDisplays(data) {


            if (data.odom) {
                document.getElementById('speedometer').textContent = `${data.odom.velocity.toFixed(2)} Km/h`;

            }

            if (data.imu) {

                document.getElementById('imuRoll').textContent = `Roll: ${data.imu.roll.toFixed(2)}°`;
                document.getElementById('imuPitch').textContent = `Pitch: ${data.imu.pitch.toFixed(2)}°`;
                document.getElementById('imuYaw').textContent = `Yaw: ${data.imu.yaw.toFixed(2)}°`;
            }

            if (data.gps) {

                const lat_dir = data.gps.latitude >= 0 ? 'N' : 'S';
                const long_dir = data.gps.longitude >= 0 ? 'E' : 'W';

                document.getElementById('gpsLat').textContent = `Lat: ${data.gps.latitude.toFixed(4)}° ${lat_dir}`;
                document.getElementById('gpsLong').textContent = `Long: ${data.gps.longitude.toFixed(4)}° ${long_dir}`;
                document.getElementById('gpsAlt').textContent = `Alt: ${data.gps.altitude.toFixed(4)}m`;
            }
        }

        function activateInstance(index, x, y, height, instanceIndex) {

            window.dummy.position.set(x, y, height / 2);
            window.dummy.scale.set(1, 1, height);
            window.dummy.rotation.set(0, 0, 0);
            window.dummy.updateMatrix();
            window.instances[instanceIndex].setMatrixAt(index, dummy.matrix);


        }

        function deactivateInstance(index, instanceIndex) {
            window.dummy.position.set(0, 0, 0);
            window.dummy.scale.set(0, 0, 0);
            window.dummy.updateMatrix();
            window.instanced[instanceIndex].setMatrixAt(index, dummy.matrix);
        }

        function updateOccupancyGridRender(incomingData) {

            let occGrid = incomingData.occupancyGrid;

            const offsetX = -occGrid.width / 2;
            const offsetY = -occGrid.height / 2;

            let instanceCounts = new Array(10).fill(0);

            for (let i = 0; i < occGrid.data.length; i++) {
                const value = occGrid.data[i];
                if (value != 0) {
                    const instanceIndex = Math.floor((value - 0.1) / 10.0);

                    const height = 5 * (value / 100.0);

                    //gotta do some weird rotations and reflections bc ethan informed me of some oddities in the ROS occGrid layout 😔
                    const y = (i % occGrid.width) + offsetX;
                    const x = (occGrid.width - Math.floor(i / occGrid.width)) + offsetY;

                    
                    activateInstance(instanceCounts[instanceIndex], x, y, height, instanceIndex);
                    instanceCounts[instanceIndex]++;

                }

            }

            for (let i = 0; i < 10; i++) {
                window.instances[i].count = instanceCounts[i];
                window.instances[i].instanceMatrix.needsUpdate = true;
            }


        }

        function updatePath(incomingData){

            let path = incomingData.poses;

            const gridWidth = 100;
            const gridHeight = 100;
            const scaleFactor = 2;

            const offsetX = -gridWidth / 2;
            const offsetY = -gridHeight / 2;

            window.pathInstance.count = path.length - 1;

            for (let i = 1; i < path.length; i++) {
                // console.log("path working")
                const position = path[i];
                const prevPosition = path[i-1];

                let diffX = position.x - prevPosition.x;
                let diffY = position.y - prevPosition.y;
                let diffZ = position.z - prevPosition.z;

                let linePos = [
                    prevPosition.x,
                    prevPosition.y,
                    prevPosition.z
                ]

                let mpX = (prevPosition.x + position.x) * 0.5;
                let mpY = (prevPosition.y + position.y) * 0.5;
                let mpZ = (prevPosition.z + position.z) * 0.5;


                let magnitude = Math.sqrt((diffX * diffX) + (diffZ * diffZ));

                let angle = Math.atan2(diffZ, diffX);

                // window.dummy.position.set(5, 0, 15);
                window.dummy.position.set(mpZ, (scaleFactor * (mpX)) + offsetX, 5); //weird ROS rotations, idk man

                window.dummy.scale.set(0.5, 10, 3); //adjust this how we like

                
                window.dummy.rotation.set(0, 0, -angle);
                window.dummy.updateMatrix();
                window.pathInstance.setMatrixAt(i - 1, window.dummy.matrix);

                window.pathInstance.frustumCulled = false;//if they are frustum culled, they are kind of all treated as one entity and so once one goes off screen they all get culled

            }

            window.pathInstance.instanceMatrix.needsUpdate = true;


        }

        function addLineSegment(incomingPosition) {


            let diffX = incomingPosition.x - window.currentPosition.x;
            let diffY = incomingPosition.y - window.currentPosition.y;
            let diffZ = incomingPosition.z - window.currentPosition.z;

            let linePos = [
                window.currentPosition.x,
                window.currentPosition.y,
                window.currentPosition.z
            ]

            let mpX = (currentPosition.x + incomingPosition.x) * 0.5;
            let mpZ = (currentPosition.z + incomingPosition.z) * 0.5;


            let magnitude = Math.sqrt((diffX * diffX) + (diffZ * diffZ));

            let angle = Math.atan2(diffZ, diffX);

            window.dummy.position.set(mpX, 0, mpZ);
            window.dummy.scale.set(magnitude, 1, 1);
            window.dummy.rotation.set(0, -angle, 0);
            window.dummy.updateMatrix();
            window.lineInstances[0].setMatrixAt(currentLineIndex, dummy.matrix);
            incrementLineIndex();

            window.lineInstances[0].instanceMatrix.needsUpdate = true;
            window.lineInstances[0].frustumCulled = false;//if they are frustum culled, they are kind of all treated as one entity and so once one goes off screen they all get culled
            window.currentPosition = incomingPosition;

            window.poseEstimatorCamera.position.set(mpX, 10, mpZ);
            window.poseEstimatorCamera.lookAt(mpX, 0, mpZ);


            window.headerTriangle.position.set(incomingPosition.x, 0, incomingPosition.z);
            window.headerTriangle.rotation.y = -angle - (Math.PI / 2);

        }

        function incrementLineIndex() {
            window.currentLineIndex++;
            window.currentLineIndex = window.currentLineIndex % window.maxLineInstances;
        }

        // Control functions
        function setMode(button) {
            const mode = button.textContent.toLowerCase();

            document.querySelectorAll('.mode-button').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
            robotState.mode = mode;

            socket.emit("setMode", { mode: mode });

            if (["autonomous", "teleop"].includes(mode)) {
                fetch("http://localhost:3000/changeMode", {
                    method: "POST",
                    body: JSON.stringify({ mode: mode }),
                    headers: {
                        "Content-type": "application/json; charset=UTF-8"
                    }
                });
            }
        }

        function emergencyStop() {
            socket.emit("emergencyStop");
        }

        window.switchFeed = function () {
            const switchButton = document.getElementById("switchButton");
            videoFeedText = document.getElementById("videoFeedText");

            const cameraFeed = document.getElementById("cameraFeed");
            const occupancyFeed = document.getElementById("occupancyFeed");
            const poseEstimatorFeed = document.getElementById("poseEstimatorFeed");


            if (showingFeed == feedStates.CAMERA_FEED) {
                showingFeed = feedStates.OCCUPANCY_FEED;

                videoFeedText.textContent = "Occupancy Grid Feed";

                cameraFeed.style.display = "none";
                occupancyFeed.style.display = "block";
                poseEstimatorFeed.style.display = "none";

                switchButton.textContent = "Switch Feed";
            } else if (showingFeed == feedStates.OCCUPANCY_FEED) {
                showingFeed = feedStates.POSE_ESTIMATOR_FEED;

                videoFeedText.textContent = "Pose Estimator Feed";


                cameraFeed.style.display = "none";
                occupancyFeed.style.display = "none";
                poseEstimatorFeed.style.display = "block";

                switchButton.textContent = "Switch Feed";
            }
            else if (showingFeed == feedStates.POSE_ESTIMATOR_FEED) {
                showingFeed = feedStates.CAMERA_FEED;

                videoFeedText.textContent = "Camera Feed";


                cameraFeed.style.display = "block";
                occupancyFeed.style.display = "none";
                poseEstimatorFeed.style.display = "none";

                switchButton.textContent = "Switch Feed";
            }

        }

        // Request initial robot state when page loads
        socket.emit("getInitialState");
    </script>
</body>

</html>
